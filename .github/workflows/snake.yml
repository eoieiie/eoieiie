name: Generate profile assets

on:
  schedule:
    - cron: "0 18 * * *"   # 매일 03:00 KST
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Draw contribution grid
        env:
          # METRICS_TOKEN(repo 스코프 PAT)이 있으면 private 기여까지 집계된다.
          # 없으면 GITHUB_TOKEN으로 떨어지고 public 기여만 잡힌다.
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/make_grid.py "${{ github.repository_owner }}" dist/grid.svg

      - name: Generate stats card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.svg
          output_action: none
          config_timezone: Asia/Seoul
          base: header, repositories
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used

      - name: Move render out of the metrics container volume
        run: |
          sudo cp /metrics_renders/metrics.svg dist/metrics.svg
          sudo chown "$USER" dist/metrics.svg
          ls -la dist/

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
